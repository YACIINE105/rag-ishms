name: rag-ishms-reviewer

services:
  fastapi:
    image: ${IMAGE_REGISTRY:-ghcr.io/yaciine105}/rag-ishms:${RELEASE_VERSION:?Run python3 configure.py --reviewer first}
    env_file: .env.fastapi
    environment:
      APP_VERSION: ${RELEASE_VERSION}
      POSTGRES_HOST: pgvector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 configure.py --reviewer first}
      API_AUTH_ENABLED: "true"
      API_CLIENTS: ${API_CLIENTS:?Run python3 configure.py --reviewer first}
      RERANKER_ENABLED: "false"
    volumes:
      - assets:/app/assets
      - api_cache:/app/.hf_cache
    depends_on:
      pgvector:
        condition: service_healthy

  pgvector:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 configure.py --reviewer first}
      POSTGRES_DB: rag-ishms
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d rag-ishms"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine3.24-perl
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      fastapi:
        condition: service_healthy

volumes:
  assets:
  api_cache:
  database:
