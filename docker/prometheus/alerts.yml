groups:
  - name: rag-service
    rules:
      - alert: RAGServiceDown
        expr: up{job="fastapi"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "RAG API scrape is unavailable"}
      - alert: RAGHighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "RAG HTTP error rate exceeds 5%"}
      - alert: RAGHighZeroHitRate
        expr: sum by (lang) (rate(rag_answers_total{outcome="no_hits"}[10m])) / clamp_min(sum by (lang) (rate(rag_answers_total[10m])), 0.001) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "RAG zero-hit rate exceeds 5% for a language"}
      - alert: RAGLowFaithfulness
        expr: rag_eval_score{metric="faithfulness"} < 0.80
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Recorded evaluation faithfulness is below 0.80"}
      - alert: RAGEvaluationStale
        expr: time() - rag_eval_last_run_timestamp_seconds > 90000
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Evaluation report has not been updated for more than 25 hours"}
      - alert: RAGEvaluationFailed
        expr: rag_eval_run_success == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "The latest evaluation did not pass"}
