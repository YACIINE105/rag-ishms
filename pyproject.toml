[project]
name = "rag-ishms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-json-logger==4.2.0",
    "aiofiles==25.1.0",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "cohere==7.0.8",
    "fastapi==0.135.1",
    "fastapi-health==0.4.0",
    "google-genai==2.16.0",
    "langchain==1.2.15",
    "langchain-community==0.4.1",
    "llama-cpp-python==0.3.34",
    "motor==3.7.1",
    "nltk==3.10.3",
    "openai==2.49.0",
    "pgvector==0.5.0",
    "prometheus-client==0.26.0",
    "psycopg2==2.9.12",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "pymupdf==1.27.2.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.22",
    "qdrant-client==1.18.0",
    "requests==2.32.5",
    "sentence-transformers==3.3.1",
    "sqlalchemy==2.0.52",
    "starlette-exporter==0.24.0",
    "transformers>=4.41.0,<5.0.0",
    "uvicorn[standard]==0.41.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["slow: tests requiring real models or external services"]
addopts = "--strict-markers --cov=src --cov-fail-under=70"

[tool.coverage.run]
source = ["src"]
omit = ["src/test_file_.py", "src/stores/llm/rerankers/test.py", "*/alembic/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
